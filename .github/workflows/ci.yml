name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the tests use
        run: |
          python -m pip install --quiet pytest ruff==0.17.6
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - run: ruff check --no-cache .
      - run: python -m pytest -q -p no:cacheprovider

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: flow
        uses: ./
      - name: Plan mode wrote a plan
        env:
          PLAN: ${{ steps.flow.outputs.plan }}
        run: python3 -c "import json, os; assert 'window_commit' in json.load(open(os.environ['PLAN']))"
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          mode: merge
      - name: An unknown mode fails
        if: steps.bad.outcome != 'failure'
        run: exit 1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*
          uvx --from dist/*.whl merge-flow --help
