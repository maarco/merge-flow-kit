name: merge-flow
description: Plan, open or land one merge for every ready pull request
inputs:
  mode:
    description: "plan (dry run, read-only), open (push the window commit and open its PR) or land (verify and merge a window PR)"
    default: plan
  window:
    description: The window PR number to land; required when mode is land
    default: ""
  base:
    description: The branch PRs merge into
    default: main
  prs:
    description: Comma-separated PR numbers in ready order; default every ready PR
    default: ""
  checks:
    description: Comma-separated required check names; default every check
    default: ""
  token:
    description: Token for gh. For open, a PAT or GitHub App token, also given to actions/checkout, since git pushes the window with the checkout's credentials; for land, a token of an account that did not open the window
    default: ${{ github.token }}
  python-version:
    description: Python used to run merge-flow
    default: "3.13"
outputs:
  plan:
    description: Path of the plan JSON written in plan and open modes
    value: ${{ steps.run.outputs.plan }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      env:
        MF_SRC: ${{ github.action_path }}
      run: python -m pip install --quiet "$MF_SRC"
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MF_MODE: ${{ inputs.mode }}
        MF_WINDOW: ${{ inputs.window }}
        MF_BASE: ${{ inputs.base }}
        MF_PRS: ${{ inputs.prs }}
        MF_CHECKS: ${{ inputs.checks }}
      run: |
        set -euo pipefail
        args=(--base "$MF_BASE")
        plan="$RUNNER_TEMP/merge-flow-plan.json"
        case "$MF_MODE" in
          plan) args+=(--json "$plan") ;;
          open) args+=(--json "$plan" --open) ;;
          land)
            if [ -z "$MF_WINDOW" ]; then
              echo "::error::mode land needs the window input"
              exit 2
            fi
            args+=(--land "$MF_WINDOW")
            plan="" ;;
          *)
            echo "::error::mode must be plan, open or land, not $MF_MODE"
            exit 2 ;;
        esac
        if [ -n "$MF_PRS" ]; then args+=(--prs "$MF_PRS"); fi
        if [ -n "$MF_CHECKS" ]; then args+=(--checks "$MF_CHECKS"); fi
        echo "plan=$plan" >> "$GITHUB_OUTPUT"
        merge-flow "${args[@]}"
